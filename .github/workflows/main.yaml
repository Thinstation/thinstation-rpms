name: Build & Deploy RPMs

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-busybox:
    strategy:
      fail-fast: false
      matrix:
        build:
          - version: "7.4"
            fedora: "44"
            arch: x86_64
            runner: ubuntu-24.04
          - version: "7.4"
            fedora: "44"
            arch: aarch64
            runner: ubuntu-24.04-arm
          - version: "7.3"
            fedora: "43"
            arch: x86_64
            runner: ubuntu-24.04
          - version: "7.2"
            fedora: "42"
            arch: x86_64
            runner: ubuntu-24.04
          - version: "7.0"
            fedora: "41"
            arch: x86_64
            runner: ubuntu-24.04

    runs-on: ${{ matrix.build.runner }}
    container: fedora:${{ matrix.build.fedora }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify native architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.build.arch }}"

      - name: Install build dependencies
        run: |
          dnf clean all
          dnf makecache
          dnf install -y rpm-build rpmdevtools libv4l-devel pam-devel 'dnf-command(builddep)'

      - name: Set up RPM build environment
        run: rpmdev-setuptree

      - name: Download BusyBox SRPM
        run: |
          dnf download --source busybox
          rpm -ivh busybox-*.src.rpm

      - name: Apply SPEC patches
        run: |
          cd ~/rpmbuild/SPECS
          if compgen -G "$GITHUB_WORKSPACE/patches/SPECS/*.patch" > /dev/null; then
            cp "$GITHUB_WORKSPACE"/patches/SPECS/*.patch .
            for patch in *.patch; do
              patch -p1 -i "$patch"
            done
          fi

      - name: Apply SOURCE patches
        run: |
          cd ~/rpmbuild/SOURCES
          if compgen -G "$GITHUB_WORKSPACE/patches/SOURCES/*.patch" > /dev/null; then
            cp "$GITHUB_WORKSPACE"/patches/SOURCES/*.patch .
            for patch in "$GITHUB_WORKSPACE"/patches/SOURCES/*.patch; do
              patch -p1 -i "$patch"
            done
          fi

      - name: Install BusyBox build dependencies
        run: dnf builddep -y ~/rpmbuild/SPECS/busybox.spec

      - name: Build BusyBox RPMs
        run: rpmbuild -ba ~/rpmbuild/SPECS/busybox.spec

      - name: Collect BusyBox RPMs
        run: |
          mkdir -p repo
          find ~/rpmbuild/RPMS -type f -name "*.rpm" -exec cp {} repo/ \;

      - name: Upload BusyBox RPMs
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.build.version }}-${{ matrix.build.arch }}-busybox
          path: repo/*.rpm

  build-ipxe:
    runs-on: ubuntu-24.04
    container: fedora:45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          dnf clean all
          dnf makecache
          dnf install -y rpm-build rpmdevtools cpio git gcc make perl-interpreter perl-Getopt-Long perl-FindBin perl-lib xz-devel syslinux

      - name: Download Fedora 45 iPXE boot image RPM
        run: |
          mkdir -p fedora-rpm
          dnf download --destdir fedora-rpm ipxe-bootimgs-x86

      - name: Build ThinStation BIOS iPXE
        run: |
          git clone --depth 1 --branch v2.0.0 https://github.com/ipxe/ipxe.git ipxe-src
          make -C ipxe-src/src -j"$(nproc)" NO_WERROR=1             bin/undionly.kpxe EMBED="$GITHUB_WORKSPACE/patches-ipxe/SOURCES/thinstation-autoexec.ipxe"
          test -s ipxe-src/src/bin/undionly.kpxe

      - name: Repack Fedora RPM with ThinStation BIOS image
        run: |
          mkdir -p original repo
          (
            cd original
            rpm2cpio ../fedora-rpm/ipxe-bootimgs-x86-*.rpm | cpio -idm --quiet
          )

          cp -a original/usr/share/ipxe/ipxe-snponly-x86_64.efi ipxe-snponly-x86_64.efi.original
          cp -a ipxe-src/src/bin/undionly.kpxe original/usr/share/ipxe/undionly.kpxe

          FEDORA_RPM="$(echo fedora-rpm/ipxe-bootimgs-x86-*.rpm)"
          VERSION="$(rpm -qp --qf '%{VERSION}' "$FEDORA_RPM")"
          EPOCH="$(rpm -qp --qf '%{EPOCHNUM}' "$FEDORA_RPM")"
          LICENSE="$(rpm -qp --qf '%{LICENSE}' "$FEDORA_RPM")"

          tar -C original -czf ~/rpmbuild/SOURCES/ipxe-bootimgs-x86-payload.tar.gz .

          cat > ~/rpmbuild/SPECS/ipxe-bootimgs-x86.spec <<EOF
          Name:           ipxe-bootimgs-x86
          Epoch:          $EPOCH
          Version:        $VERSION
          Release:        999.thinstation%{?dist}
          Summary:        X86 Network boot loader images for ThinStation
          License:        $LICENSE
          URL:            https://ipxe.org/
          Source0:        ipxe-bootimgs-x86-payload.tar.gz
          BuildArch:      noarch
          Provides:       ipxe-bootimgs = %{version}-%{release}
          Obsoletes:      ipxe-bootimgs < %{version}-%{release}

          %description
          Fedora iPXE x86 boot image package with the BIOS undionly.kpxe
          replaced by a ThinStation build embedding only "chain autoexec.ipxe".
          The UEFI payload is retained byte-for-byte from Fedora.

          %prep
          mkdir payload
          tar -xzf %{SOURCE0} -C payload

          %build

          %install
          mkdir -p %{buildroot}
          cp -a payload/. %{buildroot}/

          %files
          /usr/share/ipxe/undionly.kpxe
          /usr/share/ipxe/ipxe-snponly-x86_64.efi
          /usr/share/licenses/ipxe-bootimgs-x86/

          %changelog
          * Mon Sep 28 2026 ThinStation Project <build@thinstation.org> - $VERSION-999.thinstation
          - Preserve Fedora UEFI image and replace only BIOS loader
          EOF

          rpmbuild -bb ~/rpmbuild/SPECS/ipxe-bootimgs-x86.spec
          find ~/rpmbuild/RPMS -type f -name 'ipxe-bootimgs-x86-*.rpm' -exec cp {} repo/ \;
          test -n "$(find repo -maxdepth 1 -name 'ipxe-bootimgs-x86-*.rpm' -print -quit)"

      - name: Verify only BIOS payload changed
        run: |
          mkdir -p verify
          (
            cd verify
            rpm2cpio ../repo/ipxe-bootimgs-x86-*.rpm | cpio -idm --quiet
          )
          test -s verify/usr/share/ipxe/undionly.kpxe
          test -s verify/usr/share/ipxe/ipxe-snponly-x86_64.efi
          cmp ipxe-snponly-x86_64.efi.original verify/usr/share/ipxe/ipxe-snponly-x86_64.efi

      - name: Upload iPXE boot image RPM
        uses: actions/upload-artifact@v4
        with:
          name: repo-7.4-x86_64-ipxe
          path: repo/*.rpm

  build-ipxe-secureboot:
    runs-on: ubuntu-24.04
    container: fedora:45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RPM build tooling
        run: |
          dnf clean all
          dnf makecache
          dnf install -y rpm-build rpmdevtools curl tar

      - name: Set up RPM build environment
        run: rpmdev-setuptree

      - name: Download official signed iPXE release bundle
        run: |
          curl -fL https://github.com/ipxe/ipxe/releases/latest/download/ipxeboot.tar.gz             -o ~/rpmbuild/SOURCES/ipxe-secureboot-x86.tar.gz

      - name: Prepare spec
        run: cp specs/ipxe-secureboot-x86.spec ~/rpmbuild/SPECS/

      - name: Build Secure Boot RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/ipxe-secureboot-x86.spec

      - name: Collect Secure Boot RPM
        run: |
          mkdir -p repo
          find ~/rpmbuild/RPMS -type f -name 'ipxe-secureboot-x86-*.rpm' -exec cp {} repo/ \;

      - name: Verify signed payload layout
        run: |
          mkdir -p verify
          (
            cd verify
            rpm2cpio ../repo/ipxe-secureboot-x86-*.rpm | cpio -idm --quiet
          )
          test -s verify/usr/share/ipxe/secureboot/shimx64.efi
          test -s verify/usr/share/ipxe/secureboot/snponly.efi
          test -L verify/usr/share/ipxe/secureboot/snponly-shim.efi
          test "$(readlink verify/usr/share/ipxe/secureboot/snponly-shim.efi)" = shimx64.efi

      - name: Upload Secure Boot RPM
        uses: actions/upload-artifact@v4
        with:
          name: repo-7.4-x86_64-ipxe-secureboot
          path: repo/*.rpm

  build-gtkdialog:
    strategy:
      fail-fast: false
      matrix:
        build:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.build.runner }}
    container: fedora:44

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify native architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.build.arch }}"

      - name: Install RPM build tooling
        run: |
          dnf clean all
          dnf makecache
          dnf install -y rpm-build rpmdevtools 'dnf-command(builddep)'

      - name: Set up RPM build environment
        run: rpmdev-setuptree

      - name: Prepare gtkdialog spec
        run: cp specs/gtkdialog.spec ~/rpmbuild/SPECS/

      - name: Install gtkdialog build dependencies
        run: dnf builddep -y ~/rpmbuild/SPECS/gtkdialog.spec

      - name: Download gtkdialog source
        run: spectool -g -R ~/rpmbuild/SPECS/gtkdialog.spec

      - name: Build gtkdialog RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/gtkdialog.spec

      - name: Collect gtkdialog RPM
        run: |
          mkdir -p repo
          find ~/rpmbuild/RPMS -type f -name "gtkdialog-*.rpm" -exec cp {} repo/ \;

      - name: Upload gtkdialog RPM
        uses: actions/upload-artifact@v4
        with:
          name: repo-7.4-${{ matrix.build.arch }}-gtkdialog
          path: repo/*.rpm

  build-gnome-themes-extra:
    runs-on: ubuntu-24.04
    container: fedora:43

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf clean all
          dnf makecache
          dnf install -y rpm-build rpmdevtools 'dnf-command(builddep)'

      - name: Set up RPM build environment
        run: rpmdev-setuptree

      - name: Download gnome-themes-extra SRPM
        run: |
          dnf download --source gnome-themes-extra
          rpm -ivh gnome-themes-extra-*.src.rpm

      - name: Apply extra SPEC patches
        run: |
          cd ~/rpmbuild/SPECS
          if compgen -G "$GITHUB_WORKSPACE/patches-extra/SPECS/*.patch" > /dev/null; then
            cp "$GITHUB_WORKSPACE"/patches-extra/SPECS/*.patch .
            for patch in *.patch; do
              patch -p1 -i "$patch"
            done
          fi

      - name: Apply extra SOURCE patches
        run: |
          cd ~/rpmbuild/SOURCES
          if compgen -G "$GITHUB_WORKSPACE/patches-extra/SOURCES/*.patch" > /dev/null; then
            cp "$GITHUB_WORKSPACE"/patches-extra/SOURCES/*.patch .
            for patch in "$GITHUB_WORKSPACE"/patches-extra/SOURCES/*.patch; do
              patch -p1 -i "$patch"
            done
          fi

      - name: Install Build Dependencies
        run: dnf builddep -y ~/rpmbuild/SPECS/gnome-themes-extra.spec

      - name: Build the RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/gnome-themes-extra.spec

      - name: Collect gnome-themes-extra RPMs
        run: |
          mkdir -p repo
          find ~/rpmbuild/RPMS -type f -name "*.rpm" -exec cp {} repo/ \;

      - name: Upload gnome-themes-extra RPMs
        uses: actions/upload-artifact@v4
        with:
          name: repo-7.4-x86_64-gnome-themes-extra
          path: repo/*.rpm

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: fedora:44
    needs:
      - build-busybox
      - build-ipxe
      - build-ipxe-secureboot
      - build-gtkdialog
      - build-gnome-themes-extra

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Install repository tools
        run: |
          dnf clean all
          dnf makecache
          dnf install -y createrepo_c

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download 7.4 x86_64 RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: repo-7.4-x86_64-*
          merge-multiple: true
          path: temp/7.4/x86_64/

      - name: Download 7.4 aarch64 RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: repo-7.4-aarch64-*
          merge-multiple: true
          path: temp/7.4/aarch64/

      - name: Download 7.3 x86_64 RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: repo-7.3-x86_64-*
          merge-multiple: true
          path: temp/7.3/x86_64/

      - name: Download 7.2 x86_64 RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: repo-7.2-x86_64-*
          merge-multiple: true
          path: temp/7.2/x86_64/

      - name: Download 7.0 x86_64 RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: repo-7.0-x86_64-*
          merge-multiple: true
          path: temp/7.0/x86_64/

      - name: Build repository metadata
        run: |
          for repo in             temp/7.4/x86_64             temp/7.4/aarch64             temp/7.3/x86_64             temp/7.2/x86_64             temp/7.0/x86_64
          do
            createrepo_c "$repo"
          done

      - name: Assemble final structure
        run: |
          mkdir -p publish
          cp -r temp/* publish/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
